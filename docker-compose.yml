version: "3.9"

services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: mydb
      MARIADB_USER: myuser
      MARIADB_PASSWORD: mypassword
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-u", "myuser", "-pmypassword"]
        interval: 10s
        retries: 10
        timeout: 5s  
    networks:
    - app-network
    profiles:
      - db
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8085:8085"
    networks:
      - app-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/mydb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
    restart: on-failure
    profiles:
      - app

  stadt_backend:
    build:
      context: ./stadt_backend
      dockerfile: Dockerfile
    container_name: stadt_backend
    ports:
      - "8090:8090"
    networks:
      - app-network
    profiles:
      - app

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app-network
    profiles:
      - mqtt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend
      - stadt_backend
    profiles:
      - app
volumes:
  mariadb_data:
  
networks:
  app-network:
    driver: bridge
