name: Release for kidsapp

on:
  push:
    tags:
      - "kidsapp-v*"

jobs:
  release-java:
    name: Release Java Backends
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: "temurin"

      - name: Build Java Projects (ohne frontend)
        run: mvn clean package -DskipTests -pl '!frontend'

      - name: Stop database container
        run: docker-compose -f docker-compose.yml down

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      - name: Upload stadt_backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: stadt_backend-jar
          path: stadt_backend/target/*.jar

  release-frontend:
    name: Release Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Zeige Dateien im Projektverzeichnis
        run: |
          echo "::group::Root-Verzeichnis"
          ls -alh
          echo "::endgroup::"

          echo "::group::.next"
          ls -alh .next || echo ".next existiert nicht"
          echo "::endgroup::"

          echo "::group::out"
          ls -alh out || echo "out existiert nicht"
          echo "::endgroup::"

          echo "::group::standalone"
          ls -alh standalone || echo "standalone existiert nicht"
          echo "::endgroup::"

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
